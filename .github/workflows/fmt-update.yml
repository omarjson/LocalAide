name: Rustfmt Update

# Applies `cargo fmt --all` and publishes the result to the `ci/fmt-update`
# branch — the same pattern as Lockfile Update, used while this machine has
# no local Rust toolchain. Merge the branch back into main and delete this
# workflow once formatting is clean.

on:
  push:
    branches: [ main ]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/fmt-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-fmt:
    name: Run cargo fmt
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt and publish to ci/fmt-update
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git config user.name "ci-fmt-update"
          git config user.email "ci-fmt-update@users.noreply.github.com"
          git checkout -b ci/fmt-update || git checkout ci/fmt-update
          git add src-tauri
          if git diff --cached --quiet; then
            echo "Already formatted; nothing to publish."
            exit 0
          fi
          git commit -m "apply cargo fmt --all for ${GITHUB_SHA}"
          git push origin ci/fmt-update --force
