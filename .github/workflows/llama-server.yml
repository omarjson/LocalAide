name: Build llama-server sidecar

# Builds the llama.cpp `llama-server` binary that LocalAide runs as its chat
# engine. The binary is named the way Tauri expects sidecars to be named:
# `llama-server-<target-triple>[.exe]`.

on:
  workflow_dispatch:
    inputs:
      llama_cpp_tag:
        description: 'llama.cpp release tag to build'
        required: true
        default: 'v1.0.0'
        type: string
  workflow_call:
    inputs:
      llama_cpp_tag:
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: llama-server (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            ext: ''
          - os: macos-latest
            triple: x86_64-apple-darwin
            ext: ''
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES=x86_64'
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            ext: ''
          # Static C runtime, so the server starts on a clean Windows without
          # the Visual C++ Redistributable.
          - os: windows-2022
            triple: x86_64-pc-windows-msvc
            ext: '.exe'
            cmake_extra: '-DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded'
    steps:
      - name: Check out llama.cpp at the pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_cpp_tag }}
          path: llama.cpp
          fetch-depth: 1

      # GGML_NATIVE=OFF: build for a common CPU baseline (AVX2 on x86_64),
      # not for the CI machine's own CPU, so the server runs on users' PCs.
      # GGML_OPENMP=OFF: ggml's own thread pool, so no OpenMP runtime
      # library (vcomp140.dll, libgomp) has to be on the user's machine.
      - name: Configure (server only, static, portable CPU, no OpenSSL)
        shell: bash
        working-directory: llama.cpp
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF \
            ${{ matrix.cmake_extra }}

      - name: Build llama-server
        shell: bash
        working-directory: llama.cpp
        run: cmake --build build --config Release --target llama-server -j

      # The binary must start here, or the release would ship a server that
      # cannot run. The x86_64 macOS build needs Rosetta on Apple Silicon runners.
      - name: Stage sidecar binary and check that it runs
        shell: bash
        working-directory: llama.cpp
        run: |
          set -euo pipefail
          SRC="$(find build -type f -name "llama-server${{ matrix.ext }}" | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "llama-server binary not found" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sidecar"
          BIN="$RUNNER_TEMP/sidecar/llama-server-${{ matrix.triple }}${{ matrix.ext }}"
          cp "$SRC" "$BIN"
          if [ "${{ matrix.triple }}" = "x86_64-apple-darwin" ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta is missing on this runner, so the x86_64 macOS server was not started."
          else
            "$BIN" --version
          fi

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llama-server-${{ matrix.triple }}
          path: ${{ runner.temp }}/sidecar/llama-server-${{ matrix.triple }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14
