name: CI & Release Pipeline

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a draft GitHub Release with the built installers'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the comment names the tag).
# Dependabot (.github/dependabot.yml) proposes updates.

jobs:
  quality-gate:
    name: Quality Gate (Check, Typecheck, Test, Build, Smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Svelte & TypeScript Check
        run: |
          set +e
          npm run check > check.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Emit the svelte-check output head as annotations (readable via
            # the check-run API) so failures are diagnosable without admin
            # log access.
            head -c 4000 check.log | fold -w 300 | head -12 | while IFS= read -r line; do
              enc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error title=check::$enc"
            done
            exit 1
          fi

      - name: Frontend Build
        run: npm run build

      - name: Smoke Test
        run: npm run smoke

      - name: Unit Tests
        run: npm run test:unit

  # Every catalog pin (sha256 + size) is checked against the Hugging Face
  # API. No model downloads: only repo tree metadata. This is the permanent
  # integrity gate for catalog/models.json.
  catalog-pins:
    name: Catalog pins match Hugging Face
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify catalog pins against the HF API
        run: node scripts/verify-catalog.mjs

  # package.json carries one version, and on a tag build it must match the
  # tag and have a CHANGELOG section.
  version-gate:
    name: Version numbers agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the versions
        id: versions
        run: node scripts/ci/check-versions.mjs

  # Platform builds only run for release tags, manual dispatch, or pushes
  # whose commit message contains [build-all]. Routine pushes verify with the
  # checks above. electron-builder packages the dist/ build plus electron/.
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [quality-gate, version-gate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-all]')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Signing and notarization turn on when the repository has these
      # secrets. Without them the build is unsigned. See docs/release.md.
      - name: Use the Apple signing secrets when they exist
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No Apple certificate is set, so this macOS build is not signed."
          fi

      - name: Package (electron-builder)
        run: node node_modules/electron-builder/cli.js --mac --arch ${{ matrix.arch }} --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.dmg

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: [quality-gate, version-gate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-all]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Code signing turns on when the CSC_LINK secret exists (a certificate
      # bundle, or Azure Trusted Signing via the azure-signing option).
      # Without it the build is unsigned. See docs/release.md.
      - name: Package (electron-builder)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: node node_modules/electron-builder/cli.js --win --arch ${{ matrix.arch }} --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.blockmap

  # Built on the oldest supported Ubuntu, so the .deb and AppImage run on
  # older distributions too (a newer glibc would lock them out).
  build-linux:
    name: Build Linux (x86_64)
    needs: [quality-gate, version-gate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-all]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package (electron-builder)
        run: node node_modules/electron-builder/cli.js --linux --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: |
            release/*.AppImage
            release/*.deb

  # Releases start as drafts: a person checks the files, then publishes.
  # Each release carries SHA256SUMS.txt and an SPDX software bill of materials.
  publish-release:
    name: Draft GitHub Release
    needs: [build-macos, build-windows, build-linux, catalog-pins, version-gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts/

      - name: Collect the installers
        run: |
          set -euo pipefail
          mkdir -p release
          find release-artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} release/ \;
          ls -l release
          if [ -z "$(ls -A release)" ]; then
            echo "::error title=release::No installers were found in the build artifacts."
            exit 1
          fi

      - name: Write the software bill of materials
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: release/localaide-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write SHA256SUMS.txt
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The release notes are this version's CHANGELOG.md section plus
      # download help. Fails when the section is missing.
      - name: Write the release notes
        run: node scripts/ci/release-notes.mjs "$RUNNER_TEMP/release-notes.md"

      - name: Create the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version-gate.outputs.version) }}
          name: LocalAide ${{ needs.version-gate.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: true
          prerelease: false
