name: CI & Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release artifacts to GitHub Releases'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (Lint, Typecheck, Test, Smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Build & WebKitGTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-

      - name: Install npm dependencies
        run: npm ci

      - name: Svelte & TypeScript Check
        run: npm run check

      - name: Frontend Build
        run: npm run build

      - name: Smoke Test
        run: npm run smoke

      - name: Rust Formatting Check
        run: |
          if ! cargo fmt --check --manifest-path src-tauri/Cargo.toml 2> fmt_err.txt; then
            cargo fmt --manifest-path src-tauri/Cargo.toml 2> fmt_out_err.txt || true
            git diff -- src-tauri > fmt.diff
            {
              echo '### rustfmt stderr'
              echo '```'
              head -c 1500 fmt_err.txt
              echo '```'
              echo '### git diff'
              echo '```diff'
              head -c 6000 fmt.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Error annotations are readable through the check-run API.
            # One annotation per file with its changed lines joined, so the
            # 10-annotation cap is not wasted on headers and context lines.
            awk '/^diff --git/ { file=$3; out[file]="" }
                 /^[+-][^+-]/ { line=substr($0,2); gsub(/%/,"%25",line); if (length(out[file] line) < 800) out[file] = out[file] (out[file]==""?"":" | ") line }
                 END { for (f in out) printf "::error title=fmt:%s::%s\n", f, out[f] }' fmt.diff
            exit 1
          fi

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  llama-server:
    name: llama-server sidecar
    needs: quality-gate
    uses: ./.github/workflows/llama-server.yml
    with:
      llama_cpp_tag: v0.9.0

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: [quality-gate, llama-server]
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Download llama-server sidecar
        uses: actions/download-artifact@v4
        with:
          name: llama-server-${{ matrix.target }}
          path: sidecar

      - name: Place llama-server sidecar
        shell: bash
        run: scripts/prepare-sidecar.sh sidecar ${{ matrix.target }}

      - name: Build Tauri Package
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.sidecar.conf.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  build-windows:
    name: Build Windows (${{ matrix.target }})
    needs: [quality-gate, llama-server]
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runner\.cargo\registry
            C:\Users\runner\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Download llama-server sidecar
        uses: actions/download-artifact@v4
        with:
          name: llama-server-${{ matrix.target }}
          path: sidecar

      - name: Place llama-server sidecar
        shell: bash
        run: scripts/prepare-sidecar.sh sidecar ${{ matrix.target }}

      - name: Build Tauri Package
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.sidecar.conf.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  build-linux:
    name: Build Linux (x86_64)
    needs: [quality-gate, llama-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Build & WebKitGTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-linux-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-build-

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Download llama-server sidecar
        uses: actions/download-artifact@v4
        with:
          name: llama-server-x86_64-unknown-linux-gnu
          path: sidecar

      - name: Place llama-server sidecar
        run: scripts/prepare-sidecar.sh sidecar x86_64-unknown-linux-gnu

      - name: Build Tauri Package
        run: npx tauri build --config src-tauri/tauri.sidecar.conf.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: src-tauri/target/release/bundle/

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List downloaded release assets
        run: ls -R release-artifacts/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
