name: Dependency audit

# Checks the npm packages against the npm advisory database. Runs weekly,
# on demand, and when a lock file changes.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'package-lock.json'
      - '.github/workflows/audit.yml'

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm advisories (runtime packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Dev-only tools never ship in the app, so only runtime packages count.
      - name: Audit package-lock.json
        run: npm audit --omit=dev --audit-level=high
