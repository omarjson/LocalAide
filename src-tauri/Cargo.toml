[package]
name = "ai-desktop-assistant"
version = "0.1.0"
description = "Local-first AI desktop assistant (Rust + Tauri v2)"
authors = ["omar"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
sysinfo = "0.32"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
url = "2"
tokio = { version = "1", features = ["sync"] }
futures = "0.3"
sha2 = "0.10"
dirs-next = "2.0"
# OS-random bytes for the llama-server loopback API key (ADR-0007).
getrandom = "0.3"
notify = "8"
# voice (deferred per ADR-0006)
whisper-rs = { version = "0.16", optional = true }
piper-rs = { version = "0.2", optional = true }
hound = { version = "3", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }
flate2 = "1.1"

[features]
default = []
voice = ["whisper-rs", "piper-rs", "hound"]


