[package]
name = "ai-desktop-assistant"
version = "0.1.9"
description = "Local-first AI desktop assistant (Rust + Tauri v2)"
authors = ["omar"]
license = "MIT"
repository = "https://github.com/omarjson/LocalAide"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
# Native folder, file and save pickers (commands/desktop.rs, chat export).
tauri-plugin-dialog = "2"
# Opens http(s) links in the user's browser. Only its `open_url` function is
# used; the plugin is not registered, so the web page cannot call it directly.
tauri-plugin-opener = "2"
# In-app updates (ADR-0005). Signed packages only; the user confirms each one.
tauri-plugin-updater = "2"
sysinfo = "0.32"
# reqwest 0.13 puts `.form()` behind the "form" feature (web search uses it).
reqwest = { version = "0.13", features = ["json", "stream", "blocking", "form", "multipart"] }
url = "2"
# "time" lets a download notice Pause while the network is silent.
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures = "0.3"
sha2 = "0.11"
# sha2 0.11 digests no longer format with {:x}; hex::encode writes them.
hex = "0.4"
dirs-next = "2.0"
# OS-random bytes for the llama-server loopback API key (ADR-0007).
getrandom = "0.4"
notify = "8"
# voice (deferred per ADR-0006)
whisper-rs = { version = "0.16", optional = true }
piper-rs = { version = "0.2", optional = true }
hound = { version = "3", optional = true }
rusqlite = { version = "0.42.0", features = ["bundled"] }
flate2 = "1.1"
# Library ingest: UTF-16 and Windows-1252 text files, and real PDF text
# (fonts and encodings). The hand-written PDF reader stays as a fallback.
encoding_rs = "0.8"
pdf-extract = "0.12"
# Encrypted backups (ADR-0009): AES-256-GCM with an argon2id-derived key.
aes-gcm = "0.11"
argon2 = "0.6"
# Wipes backup keys and decrypted backups from memory after use.
zeroize = "1"
# The local server behind "Share my assistant" (127.0.0.1 only).
tiny_http = "0.12"
# Audio for online transcription is sent as base64.
base64 = "0.22"
# Live transcription over WebSocket (Gemini Live, Deepgram, Soniox).
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }

# The terminal tool kills a command's whole process group on timeout.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Async tests for the HTTP clients (OpenCode link, skill discovery).
[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
voice = ["whisper-rs", "piper-rs", "hound"]

# Backup key derivation (Argon2id, 64 MiB) is very slow without
# optimization, so these crates are optimized in debug and test builds too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Smaller release builds. Thin LTO keeps most of the size gain of full LTO
# and needs far less memory to build, which matters on 7 GB macOS runners.
# Panics keep unwinding (the default), so a damaged PDF caught by
# `catch_unwind` cannot take the app down, and drop handlers still stop the
# engine processes.
[profile.release]
lto = "thin"
strip = true
