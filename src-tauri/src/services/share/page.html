<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>LocalAide · shared</title>
<style>
  :root {
    --bg: #1c1c1e; --panel: #232325; --inset: #18181a; --line: #34343a; --line-2: #2a2a2e;
    --ink: #f3f3f3; --ink-2: #c9c9cc; --ink-3: #9b9ba1; --ink-4: #75757c;
    --ember: #e8680c; --ember-2: #ff8a3d; --on-ember: #1b1b1f; --ok: #34d399; --bad: #fda4af;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f7; --panel: #ffffff; --inset: #eef0f3; --line: #d2d6dc; --line-2: #e3e6ea;
      --ink: #1b1b1f; --ink-2: #2e3036; --ink-3: #5b5f66; --ink-4: #6b6f76; --ember: #b54a00; --ember-2: #9a3f00; --on-ember: #fff; --ok: #047857; --bad: #be123c; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  aside { border-right: 1px solid var(--line-2); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--ember); display: grid; place-items: center; color: var(--on-ember); font-weight: 700; font-size: 13px; }
  .brand b { font-size: 15px; }
  .role { margin: 0 16px 12px; padding: 8px 10px; border-radius: 10px; background: var(--inset); font-size: 13px; color: var(--ink-3); }
  .role strong { color: var(--ink); font-weight: 600; }
  .threads { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .thread { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread:hover { background: var(--panel); }
  .thread[aria-current="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 2px 0 0 var(--ember); }
  .side-actions { padding: 12px 16px 16px; border-top: 1px solid var(--line-2); display: grid; gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
  .btn:hover:not(:disabled) { border-color: var(--ink-4); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--ember); border-color: var(--ember); color: var(--on-ember); font-weight: 600; }
  .btn-quiet { background: transparent; border-color: transparent; color: var(--ink-3); }
  main { display: flex; flex-direction: column; min-height: 0; }
  header { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--line-2); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: color-mix(in oklab, var(--ember) 14%, transparent); color: var(--ember-2); white-space: nowrap; }
  .log { flex: 1; overflow-y: auto; }
  .col { max-width: 760px; margin: 0 auto; padding: 24px 20px 12px; display: grid; gap: 22px; }
  .msg-user { justify-self: end; max-width: 85%; background: var(--panel); border: 1px solid var(--line-2); padding: 10px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; word-break: break-word; }
  .msg-ai { display: grid; gap: 10px; }
  .msg-ai p { margin: 0 0 .7em; } .msg-ai p:last-child { margin-bottom: 0; }
  .msg-ai pre { margin: 0; background: var(--inset); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .msg-ai code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--inset); padding: 1px 5px; border-radius: 5px; }
  .meta { font-size: 12px; color: var(--ink-4); }
  .tool { border: 1px solid var(--line-2); border-radius: 10px; background: color-mix(in oklab, var(--inset) 70%, transparent); font-size: 14px; }
  .tool-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; }
  .tool-head .t { font-weight: 500; } .tool-head .d { color: var(--ink-3); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-head .s { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .tool-head .s.ok { color: var(--ok); } .tool-head .s.bad { color: var(--bad); } .tool-head .s.wait { color: var(--ember-2); font-weight: 600; }
  .tool.waiting { border-color: color-mix(in oklab, var(--ember) 55%, transparent); }
  .tool-body { border-top: 1px solid var(--line-2); padding: 10px 12px; display: grid; gap: 10px; }
  .term { background: #0c0d0f; color: #d6d8dc; border-radius: 8px; padding: 8px 10px; font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 18rem; overflow: auto; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 12px 4px 5px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
  .opt:hover:not(:disabled) { border-color: var(--ink-4); }
  .opt:disabled { opacity: .45; cursor: default; }
  .opt .k { display: grid; place-items: center; min-width: 22px; height: 22px; border-radius: 6px; background: var(--inset); font: 12px ui-monospace, monospace; color: var(--ink-3); }
  .opt.primary { background: var(--ember); border-color: var(--ember); color: var(--on-ember); font-weight: 600; }
  .opt.primary .k { background: rgba(0,0,0,.15); color: inherit; }
  .opt.on { border-color: var(--ember); }
  .composer { flex-shrink: 0; padding: 8px 20px 18px; }
  .box { max-width: 760px; margin: 0 auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px; }
  .box textarea { flex: 1; resize: none; border: 0; background: transparent; outline: none; min-height: 24px; max-height: 200px; padding: 6px 0; line-height: 1.5; }
  .send { width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--ember); color: var(--on-ember); display: grid; place-items: center; flex-shrink: 0; }
  .send:disabled { background: var(--line); color: var(--ink-4); cursor: default; }
  .note { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--ink-4); text-align: center; }
  .center { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; }
  .center .card { max-width: 420px; }
  .center h2 { font-size: 20px; margin: 12px 0 6px; }
  .center p { color: var(--ink-3); margin: 0; }
  .steps { display: grid; gap: 0; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }
  .step { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line-2); font-size: 14px; }
  .step:first-child { border-top: 0; }
  .step .n { width: 22px; height: 22px; flex-shrink: 0; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--inset); color: var(--ink-3); }
  .step.pass .n { color: var(--ok); } .step.fail .n { color: var(--bad); } .step.running .n { color: var(--ember-2); }
  .step small { display: block; color: var(--ink-3); font-size: 13px; }
  .empty { color: var(--ink-3); text-align: center; padding: 48px 0; }
  .menu-btn { display: none; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: 82%; max-width: 300px; background: var(--bg); z-index: 5; transform: translateX(-100%); transition: transform .2s ease-out; }
    aside.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.4); }
    .menu-btn { display: inline-flex; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
</head>
<body>
<div id="root" class="center"><div class="card"><div class="brand-mark" style="margin:0 auto">L</div><h2>Opening the shared assistant…</h2></div></div>
<script src="/app.js"></script>
</body>
</html>
