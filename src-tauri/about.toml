# cargo-about: licenses that may appear in THIRD_PARTY_LICENSES.html.
# A crate under any other license fails the CI "Third-party licenses" job,
# so a new license is a decision, not an accident.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# Build tools and test helpers do not ship in the app.
ignore-build-dependencies = true
ignore-dev-dependencies = true
